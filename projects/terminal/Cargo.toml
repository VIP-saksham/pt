[package]
name = "saksham-terminal"
version = "0.1.0"
edition = "2024"
authors = ["Saksham Swaroop <pollysmarty11@gmail.com>"]
description = "SAKSHAM Terminal — an interactive command-line portfolio (Rust + Leptos + WASM)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Own workspace: keep cargo from walking up into an unrelated parent workspace.
[workspace]
